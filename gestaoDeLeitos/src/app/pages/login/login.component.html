<div class="login-container">
  <mat-card class="login-card">
    <div class="login-header">
      <div class="logo-container">
        <div class="logo-icon">🏥</div>
        <h1>Gestão de Leitos</h1>
      </div>
      <p class="subtitle">Sistema Integrado de Gerenciamento Hospitalar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Input -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>E-mail</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="seuemail@hospital.com"
        />
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="isFieldInvalid('email')">
          E-mail é obrigatório
        </mat-error>
      </mat-form-field>

      <!-- Password Input -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input
          matInput
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
          class="visibility-toggle"
        >
          <mat-icon>{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error *ngIf="isFieldInvalid('password')">
          Senha é obrigatória
        </mat-error>
      </mat-form-field>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <mat-checkbox formControlName="rememberMe">
          Lembrar-me
        </mat-checkbox>
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <!-- Login Button -->
      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="btn-login"
        [disabled]="loginForm.invalid || isLoading"
      >
        <mat-icon *ngIf="isLoading" class="spinner">
          <mat-spinner diameter="18"></mat-spinner>
        </mat-icon>
        <span>{{ isLoading ? 'Entrando...' : 'Entrar' }}</span>
      </button>

      <!-- Demo Credentials -->
      <div class="demo-credentials" *ngIf="!isProduction">
        <p class="demo-title">Credenciais de Demonstração:</p>
        <div class="demo-roles">
          <button mat-stroked-button type="button" (click)="fillDemoCredentials('ADMIN')">Admin</button>
          <button mat-stroked-button type="button" (click)="fillDemoCredentials('MEDICO')">Médico</button>
          <button mat-stroked-button type="button" (click)="fillDemoCredentials('ENFERMAGEM')">Enfermagem</button>
          <button mat-stroked-button type="button" (click)="fillDemoCredentials('TRIAGEM')">Triagem</button>
          <button mat-stroked-button type="button" (click)="fillDemoCredentials('LIMPEZA')">Limpeza</button>
        </div>
      </div>
    </form>
  </mat-card>

  <div class="login-footer">
    <p>© 2026 Sistema de Gestão de Leitos - FHIR Compliant</p>
  </div>
</div>
