<div class="leitos-container">
  <div class="page-header">
    <h2>🛏️ Gestão de Leitos</h2>
    <button class="btn-primary" (click)="loadLeitos()">
      🔄 Atualizar
    </button>
  </div>

  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Carregando leitos...</p>
  </div>

  <div class="error" *ngIf="error">
    <p>❌ {{ error }}</p>
    <button (click)="loadLeitos()">Tentar novamente</button>
  </div>

  <div class="leitos-grid" *ngIf="!loading && !error">
    <div class="leito-card" *ngFor="let leito of leitos" [class]="getStatusClass(leito.status)">
      <div class="leito-header">
        <h3>{{ leito.alias }}</h3>
        <span class="status-badge" [class]="getStatusClass(leito.status)">
          {{ getStatusLabel(leito.status) }}
        </span>
      </div>
      <div class="leito-body">
        <div class="info-row" *ngIf="leito.specialization">
          <span class="label">Especialização:</span>
          <span class="value">{{ leito.specialization }}</span>
        </div>
        <div class="info-row" *ngIf="leito.type">
          <span class="label">Tipo:</span>
          <span class="value">{{ leito.type }}</span>
        </div>
        <div class="info-row" *ngIf="leito.capacity">
          <span class="label">Capacidade:</span>
          <span class="value">{{ leito.capacity }}</span>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="leitos.length === 0">
      <p>📭 Nenhum leito cadastrado</p>
    </div>
  </div>
</div>
