<div class="dashboard animate-fade-up">

  <!-- Stats Summary -->
  <div class="dashboard__stats">
    <div class="stat-card">
      <div class="stat-card__value">{{ stats.total }}</div>
      <div class="stat-card__label">Total de Leitos</div>
    </div>
    <div class="stat-card stat-card--success">
      <div class="stat-card__value">{{ stats.disponivel }}</div>
      <div class="stat-card__label">Disponíveis</div>
    </div>
    <div class="stat-card stat-card--info">
      <div class="stat-card__value">{{ stats.ocupado }}</div>
      <div class="stat-card__label">Ocupados</div>
    </div>
    <div class="stat-card stat-card--warning">
      <div class="stat-card__value">{{ stats.higienizacao }}</div>
      <div class="stat-card__label">Em Higienização</div>
    </div>
  </div>

  <!-- Header com filtros -->
  <div class="dashboard__toolbar">
    <h2 class="dashboard__title">Mapa de Leitos</h2>
    <div class="filter-pills">
      <button
        *ngFor="let opt of statusOptions"
        class="filter-pill"
        [class.filter-pill--active]="filterStatus === opt.value"
        (click)="setFilter(opt.value)"
      >
        {{ opt.label }}
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-state" *ngIf="loading">
    <div class="loading-spinner"></div>
    <span>Carregando leitos...</span>
  </div>

  <!-- Grid de Leitos -->
  <div class="beds-grid" *ngIf="!loading">
    <app-leito-card
      *ngFor="let card of filteredCards"
      [bed]="card.bed"
      [patient]="card.patient"
      [encounter]="card.encounter"
      (cleaningRequest)="handleEmergencyCleaning($event)"
    ></app-leito-card>
  </div>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="!loading && filteredCards.length === 0">
    <div class="empty-state__icon">🏥</div>
    <p>Nenhum leito encontrado para o filtro selecionado.</p>
  </div>

</div>
