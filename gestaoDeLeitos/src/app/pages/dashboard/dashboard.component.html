<div class="dashboard-container">
  <mat-card class="welcome-section">
    <h1>Bem-vindo, {{ getUserName() }}!</h1>
    <p class="user-role">{{ getUserRoleLabel() }} - Visão geral do sistema de gestão de leitos</p>
  </mat-card>

  <div class="loading" *ngIf="loading">
    <mat-spinner diameter="56"></mat-spinner>
    <p>Carregando dados...</p>
  </div>

  <mat-card class="error" *ngIf="error">
    <p>{{ error }}</p>
    <button mat-raised-button color="warn" (click)="loadDashboardData()">Tentar novamente</button>
  </mat-card>

  <div class="dashboard-content" *ngIf="!loading && !error">
    <div class="stats-grid">
      <mat-card
        *ngFor="let card of cards"
        class="stat-card"
        [ngClass]="card.color"
        [class.clickable]="card.route"
        (click)="handleCardClick(card)">
        <div class="stat-icon">
          <mat-icon>{{ getMaterialIcon(card.icon) }}</mat-icon>
        </div>
        <div class="stat-content">
          <h3>{{ card.title }}</h3>
          <p class="stat-number">{{ card.value }}</p>
          <span class="stat-label">{{ card.label }}</span>

          <div class="progress-bar" *ngIf="card.title === 'Taxa de Ocupação'">
            <mat-progress-bar mode="determinate" [value]="getProgressBarWidth()"></mat-progress-bar>
          </div>
        </div>
      </mat-card>
    </div>

    <div class="quick-actions" *ngIf="quickActions.length > 0">
      <h2>Ações Rápidas</h2>
      <div class="actions-grid">
        <button
          *ngFor="let action of quickActions"
          mat-stroked-button
          class="action-btn"
          [ngClass]="action.color"
          (click)="handleActionClick(action)">
          <span class="action-icon">
            <mat-icon>{{ getMaterialIcon(action.icon) }}</mat-icon>
          </span>
          <span class="action-text">
            <strong>{{ action.title }}</strong>
            <small>{{ action.subtitle }}</small>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
