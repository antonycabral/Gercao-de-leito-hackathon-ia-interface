<a
  [routerLink]="['/leitos', bed.id]"
  class="leito-card leito-card--{{ bed.status }}"
  [class.leito-card--overdue]="isOverdue"
  [title]="'Leito ' + bed.alias[0]"
>
  <!-- Indicador lateral de status -->
  <div class="leito-card__stripe"></div>

  <div class="leito-card__body">
    <!-- Header: código + badge -->
    <div class="leito-card__header">
      <span class="leito-card__code">{{ bed.alias[0] }}</span>
      <app-status-badge [status]="bed.status"></app-status-badge>
    </div>

    <!-- Paciente -->
    <div class="leito-card__patient" *ngIf="patient">
      <span class="risk-badge risk-badge--{{ patient.riskColor }}"></span>
      <span class="leito-card__patient-name">{{ patientName }}</span>
    </div>
    <div class="leito-card__patient leito-card__patient--empty" *ngIf="!patient">
      Sem paciente
    </div>

    <!-- EDD -->
    <div class="leito-card__edd" *ngIf="estimatedDischarge">
      <span [class.leito-card__edd--overdue]="isOverdue">
        {{ isOverdue ? '⚠️' : '📋' }} {{ estimatedDischarge | date:'dd/MM' }}
      </span>
    </div>

    <!-- Botão limpeza emergência (RF.05) -->
    <button
      *ngIf="bed.status === 'OCUPADO'"
      class="leito-card__panic-btn"
      (click)="requestCleaning($event)"
      title="Acionar limpeza de emergência"
    >
      🚨
    </button>
  </div>
</a>
