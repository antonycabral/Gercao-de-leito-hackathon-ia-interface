<div class="notifications-container">
  <mat-card
    *ngFor="let notification of notifications$ | async"
    class="notification"
    [class.success]="notification.type === 'success'"
    [class.error]="notification.type === 'error'"
    [class.warning]="notification.type === 'warning'"
    [class.info]="notification.type === 'info'"
    [@slideIn]>

    <div class="notification-icon">
      <mat-icon *ngIf="notification.type === 'success'">check_circle</mat-icon>
      <mat-icon *ngIf="notification.type === 'error'">error</mat-icon>
      <mat-icon *ngIf="notification.type === 'warning'">warning</mat-icon>
      <mat-icon *ngIf="notification.type === 'info'">info</mat-icon>
    </div>

    <div class="notification-content">
      <h4 *ngIf="notification.title" class="notification-title">{{ notification.title }}</h4>
      <p class="notification-message">{{ notification.message }}</p>

      <button
        *ngIf="notification.action"
        mat-stroked-button
        class="notification-action"
        (click)="onAction(notification)">
        {{ notification.action.label }}
      </button>
    </div>

    <button
      *ngIf="notification.dismissible"
      mat-icon-button
      class="notification-close"
      (click)="dismiss(notification.id)"
      aria-label="Fechar">
      <mat-icon>close</mat-icon>
    </button>
  </mat-card>
</div>
